        <main>


        <div class="container my-5">
            <div class="row">
            <div class="col-12 col-md-10 col-lg-8 mx-auto">
            <h2 class="text-center mb-4">Explore the Beauty of Lesotho.</h2>
            <div id="lesothoCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="phothos/Afriski Les..jpg" class="d-block w-70 img-fluid rounded shadow" alt="Afriski Mountain Resort in Lesotho"
                        style="max-height: 400px; object-fit: cover;">
                        <div class="carousel-caption d-block">
                            <h5>Afriski Lesotho</h5>
                        </div>
                        </div>
                        <div class="carousel-item">
                            <img src="phothos/Katse_Dam (1).jpg" class="d-block w-70 img-fluid rounded shadow" alt="Katse Dam lesotho"
                            style="max-height: 400px; object-fit: cover;">
                            <div class="carousel-caption d-block">
                                <h5>Katse Dam</h5>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="phothos/Maletssunyane 2.jpg" class="d-block w-70 img-fluid rounded shadow" alt="Place of smokes Maletsunyane falls"
                            style="max-height: 400px; object-fit: cover;">
                            <div class="carousel-caption d-block">
                                <h5>Maletsunyane Falls</h5>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="phothos/mountains.jpg.jpg" class="d-block w-100 img-fluid rounded shadow" alt="Lesotho beautiful mountains"
                            style="max-height: 400px; object-fit: cover;">
                            <div class="carousel-caption">
                                <h5>Lesotho Mountain</h5>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="phothos/Sain Pass.jpg" class="d-block w-100 img-fluid rounded shadow" alt="Sani pass Lesotho"
                            style="max-height: 400px; object-fit: cover;">
                            <div class="carousel-caption">
                                <h5>Sani Pass</h5>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="phothos/Litolobonya.jpg" class="d-block w-100 img-fluid rounded shadow" alt="Cultural activities Lesotho"
                            style="max-height: 400px; object-fit: cover;">
                            <div class="carousel-caption">
                                <h5>Cultural Activity</h5>
                            </div>
                            </div> 
                        </div>
                    
                    <button class="carousel-control-prev" type="button" data-bs-target="#lesothoCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>                    
                    </button>
    
                    <button class="carousel-control-next" type="button" data-bs-target="#lesothoCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>                   
                </div>
            </div>
            </div>

        </div>
</main>
