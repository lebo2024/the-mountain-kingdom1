        <h1>Start your Lesotho journey.</h1>
        <p>Do you want to learn more about visiting Lesotho? send us your enquiry using the form below.</p>

        <form id="contactForm">
            <label for="Name">Full Name:</label>
            <input type="text" id="Name" Name="name" required>
            <div class="invalid-feedback"></div>

            <br><br>

            <label for="Email">Email Address:</label>
            <input type="Email" id="Email" name="Email" required>
            <br><br>

            <label for="rPhone" class="form-control">Phone</label>
                <input type="tel" class="contactForm" id="rPhone" name="phone" required pattern="[0-9+]{7,15}"
            title="Numbers only,7 to 15 digits">
                <div class="invalid-feedback"></div>

                <select class="form-select" id="rGender" required>
                    <option value="gender">Choose Gender</option>
                    <option>Female</option>
                    <option>Male</option>
                    </select>
                
                <label for="rGender" class="form-control">Gender</label>
                <input type="gender" class="contactForm" id="rGender" name="gender" required>
                <div class="invalid-feedback"></div>

                <label for="password" class="form-control">Password</label>
                <input type="tel" class="contactForm" id="rpass" add="minlength="8" " name="password" required>
                <div class="invalid-feedback"></div>

                <label for="rConfirm" class="form-control">Confirm password</label>
                <input type="password" class="contactForm" id="rConfirm" name="Confirm password" required>
                <div class="invalid-feedback"></div>

          <label for="Message">Your Massege:</label>
            <textarea id="Message" name="Message" rows="6" required></textarea>
            <br><br>

            <button type="submit">Send Equiry</button>

            </div>
            <div id="registerMessage"></div>
            </form>
        </body>
        <script src="script.js"></script>
</html>
